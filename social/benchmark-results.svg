<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spam detection benchmark: three-model comparison</title>
  <desc id="desc">Of 200 legitimate emails, Gemma flagged 70, Clef flagged 5 and Clef-Flash flagged 9. Of 100 spam messages, Gemma caught 100, Clef caught 99 and Clef-Flash caught 100. Clef models use a 0.9 threshold. Average AI inference times were 587 milliseconds for Gemma, 383 for Clef, and 152 for Clef-Flash. Historical SpamAssassin corpus, not a production benchmark.</desc>
  <rect width="1600" height="900" fill="#FAF9F6"/>

  <text x="114" y="168" fill="#243337" font-family="Avenir Next, Avenir, sans-serif" font-size="68" font-weight="600" letter-spacing="-2">Spam detection benchmark</text>
  <text x="1486" y="165" fill="#7C8982" font-family="Menlo, monospace" font-size="21" text-anchor="end">300 emails · Clef @0.9</text>
  <line x1="114" y1="216" x2="1486" y2="216" stroke="#D9DED8" stroke-width="2"/>

  <text x="116" y="282" fill="#75827B" font-family="Menlo, monospace" font-size="20">MODEL</text>
  <text x="520" y="282" fill="#75827B" font-family="Menlo, monospace" font-size="20">LEGIT FLAGGED / 200</text>
  <text x="970" y="282" fill="#75827B" font-family="Menlo, monospace" font-size="20">SPAM CAUGHT / 100</text>
  <text x="1294" y="282" fill="#75827B" font-family="Menlo, monospace" font-size="20">AVG TIME (MS)</text>

  <text x="116" y="415" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="47" font-weight="500">Gemma</text>
  <text x="520" y="414" fill="#8E8178" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="600">70</text>
  <text x="970" y="414" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">100</text>
  <text x="1294" y="414" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">587</text>
  <line x1="116" y1="475" x2="1486" y2="475" stroke="#E1E5DF" stroke-width="2"/>

  <text x="116" y="565" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="47" font-weight="600">Clef</text>
  <text x="520" y="564" fill="#4E7D74" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="600">5</text>
  <text x="970" y="564" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">99</text>
  <text x="1294" y="564" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">383</text>
  <line x1="116" y1="625" x2="1486" y2="625" stroke="#E1E5DF" stroke-width="2"/>

  <text x="116" y="715" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="47" font-weight="500">Clef-Flash</text>
  <text x="520" y="714" fill="#4E7D74" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="600">9</text>
  <text x="970" y="714" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">100</text>
  <text x="1294" y="714" fill="#27383B" font-family="Avenir Next, Avenir, sans-serif" font-size="64" font-weight="500">152</text>

  <line x1="114" y1="785" x2="1486" y2="785" stroke="#D9DED8" stroke-width="2"/>
  <text x="116" y="841" fill="#637971" font-family="Menlo, monospace" font-size="20">github.com/harshil1712/spam-detection-benchmark</text>
</svg>
